<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rotate PDF - SmartToolKits</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">

        🚀 SmartToolKits

    </div>

</header>

<section class="hero">

    <div class="hero-content">

        <span class="badge">

            ROTATE PDF

        </span>

        <h1>

            Rotate PDF Pages

        </h1>

        <p>

            Upload your PDF and rotate every page by 90°, 180° or 270° before downloading.

        </p>

    </div>

</section>

<section class="upload-section">

    <div class="upload-card">

        <label for="pdfInput" class="upload-box">

            <div class="upload-icon">

                🔄

            </div>

            <h2>

                Select PDF File

            </h2>

            <p>

                Click here to upload your PDF

            </p>

            <input
                type="file"
                id="pdfInput"
                accept=".pdf,application/pdf"
                hidden>

        </label>

        <div id="fileInfo"></div>

        <div class="rotate-options">

            <label>

                Rotation Angle

            </label>

            <select id="rotationAngle">

                <option value="90">90° Clockwise</option>

                <option value="180">180°</option>

                <option value="270">270° Clockwise</option>

            </select>

        </div>

        <div class="buttons">

            <button id="rotateBtn">

                Rotate PDF

            </button>

            <button id="downloadBtn" style="display:none;">

                Download PDF

            </button>

        </div>

    </div>

</section>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<script src="script.js"></script>

</body>

</html>
