<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Image - SmartToolKits</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>🚀 SmartToolKits</h2>
    </header>

    <section class="hero">

        <h1>PDF to Image</h1>

        <p>Convert PDF pages into JPG or PNG images.</p>

        <input type="file" id="pdfInput" accept=".pdf">

        <br><br>

        <div style="margin:20px 0;">
            <label>
                <input type="radio" name="format" value="png" checked>
                PNG
            </label>

            &nbsp;&nbsp;

            <label>
                <input type="radio" name="format" value="jpg">
                JPG
            </label>
        </div>

       <div class="button-group">
    <button id="convertBtn">
        Convert to Images
    </button>

    <button id="downloadAllBtn" style="display:none;">
        Download All (ZIP)
    </button>
</div>

<div id="output"></div>
        

    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
